id: exp3_random_forest
family: arboles
hypothesis: >-
  Las relaciones entre TTL, estado y conteos son no lineales; un bosque aleatorio capta
  interacciones y mejora macro-F1 y FPR frente a los modelos lineales.
change: Familia de modelo (bosque aleatorio) con codificación ordinal de categóricas.
seed: 42
threshold: 0.5
preprocess: {kind: tree}
model:
  type: random_forest
  params: {n_estimators: 150, max_depth: 20, min_samples_leaf: 3, n_jobs: -1}
